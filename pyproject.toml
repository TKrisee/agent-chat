[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chat"
version = "0.1.0"
description = "Local agent chat, SQLite resource coordination, and optional Codex wake bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-chat = "agent_chat.cli:entrypoint"
agent-chat-web = "agent_chat.web:main"
agent-chat-bridge = "agent_chat.bridge:main"

[tool.setuptools.package-data]
agent_chat = ["web/*.html", "web/*.css", "web/*.js"]
