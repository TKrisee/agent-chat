[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chat"
version = "0.4.0"
description = "Hosted agent chat with a local Codex client bridge"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agent-chat-server = "agent_chat.server:main"
agent-chat-client = "agent_chat.cli:entrypoint"
agent-chat-service = "agent_chat.service:main"
agent-chat-ownership-disposition = "agent_chat.ownership_disposition:main"
agent-chat-root-guidance = "agent_chat.root_guidance:main"
agent-chat-project-guidance = "agent_chat.project_guidance:main"

[tool.setuptools.package-data]
agent_chat = ["web/*.html", "web/*.css", "web/*.js", "templates/*.md"]
