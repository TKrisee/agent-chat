version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels: [dependencies]
  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: daily
    labels: [dependencies]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: daily
    labels: [dependencies]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
