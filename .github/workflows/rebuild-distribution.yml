name: Go distribution

on:
  push:
  pull_request:
    paths: ['src/**', 'third_party/codex/**', '.github/workflows/rebuild-distribution.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag to retry asset publication
        required: false
        type: string
      previous_target_sha:
        description: Prior draft target SHA to retarget after a corrected build passes
        required: false
        type: string
      expected_sha:
        description: Exact source commit expected for a manual run
        required: true
        type: string
      test_only:
        description: Test candidate source without creating or publishing a release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          EXPECTED: ${{ inputs.expected_sha }}
          TEST_ONLY: ${{ inputs.test_only }}
          TAG: ${{ inputs.release_tag }}
          PREVIOUS: ${{ inputs.previous_target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ && "$EXPECTED" == "$SHA" ]]
          fi
          if [[ -n "$PREVIOUS" ]]; then
            [[ "$EVENT" == workflow_dispatch && "$TEST_ONLY" != true && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$PREVIOUS" =~ ^[0-9a-f]{40}$ && "$PREVIOUS" != "$SHA" ]]
            gh api "repos/$REPO/compare/$PREVIOUS...$SHA" | jq -e --arg old "$PREVIOUS" '.status == "ahead" and .merge_base_commit.sha == $old' >/dev/null
          fi
          if [[ "$EVENT" != pull_request && "$TEST_ONLY" != true ]]; then
            current=$(gh api "repos/$REPO/git/ref/heads/main" | jq -er '.object.sha')
            [[ "$current" == "$SHA" ]]
          fi
          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
  release:
    needs: guard
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.test_only != true && inputs.release_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Pin new draft to tested source commit
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ needs.guard.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$REPO/releases?per_page=100" | jq -ers --arg tag "$TAG" '[.[][] | select(.tag_name == $tag or (.draft == true and (.tag_name | startswith("untagged-")) and .name == $tag))] | if length == 1 and .[0].draft == true then .[0].id else error("unique draft required") end')
          gh api --method PATCH "repos/$REPO/releases/$id" -f target_commitish="$SHA" >/dev/null

  package:
    needs: [guard, release]
    if: always() && needs.guard.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-15
            platform: darwin-arm64
          - os: windows-2025
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src
        shell: pwsh
    env:
      CGO_ENABLED: '1'
      RELEASE_TAG: ${{ needs.release.outputs.tag || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Build web UI
        run: |
          Push-Location web
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Test and build real runtime
        run: |
          jq --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gcc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags codexruntime ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = if ($IsWindows) { 'agentchat.exe' } else { 'agentchat' }
          go build -tags codexruntime -trimpath -ldflags "-X main.releaseBaseURL=https://github.com/${{ github.repository }}/releases" -o "dist/$exe" ./cmd/agentchat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.TrimStart('v') } else { '0.0.0' }
          $launcher = if ($IsWindows) { 'agentchat-launcher.exe' } else { 'agentchat-launcher' }
          go build -trimpath -ldflags "-X main.version=$version" -o "dist/$launcher" ./cmd/agentchat-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse web/dist dist/web
          Copy-Item -Recurse packaging dist/packaging
          Copy-Item ../README.md dist/README.md
          Copy-Item ../third_party/codex/LICENSE dist/CODEX-LICENSE
          Copy-Item ../third_party/codex/NOTICE dist/CODEX-NOTICE
      - name: Verify pinned native Codex package
        run: ./packaging/bundle-codex.ps1 -Platform '${{ matrix.platform }}'
      - name: Test Windows process containment
        if: runner.os == 'Windows'
        run: |
          go test -tags codexruntime ./internal/codexruntime -run '^TestWindowsProcessStartsOnlyAfterContainment$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke packaged binary and UI
        run: |
          $exe = if ($IsWindows) { 'agentchat.exe' } else { 'agentchat' }
          $data = Join-Path $env:RUNNER_TEMP 'agentchat-smoke'
          $ui = Join-Path $PWD 'dist/web'
          $proc = Start-Process -FilePath (Join-Path $PWD "dist/$exe") -ArgumentList @('-data', "`"$data`"", '-static', "`"$ui`"", '-listen', '127.0.0.1:18877') -PassThru
          try {
            $response = $null
            for ($i = 0; $i -lt 30; $i++) {
              try { $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18877/'; break } catch { Start-Sleep -Seconds 1 }
            }
            if (!$response -or $response.StatusCode -ne 200 -or $response.Content -notmatch '<html') { throw 'UI smoke failed' }
            $state = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18877/api/state'
            if ($state.StatusCode -ne 200) { throw 'API smoke failed' }
          } finally { if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }; $proc.WaitForExit() }
      - name: Smoke Windows service lifecycle
        if: runner.os == 'Windows'
        run: ./tests/windows-service-smoke.ps1
      - name: Start Linux user manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
      - name: Smoke Linux user service
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/linux-service-smoke.sh
      - name: Create archive and checksum
        run: |
          $archive = if ($IsWindows) { 'agentchat-${{ matrix.platform }}.zip' } else { 'agentchat-${{ matrix.platform }}.tar.gz' }
          if ($IsWindows) { Compress-Archive -Path dist/* -DestinationPath $archive }
          else {
            tar -czf $archive -C dist .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          go run ./cmd/packagecheck check $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: agentchat-${{ matrix.platform }}
          path: |
            src/agentchat-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: [guard, release, package]
    if: always() && needs.package.result == 'success' && inputs.test_only != true && (needs.release.outputs.created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: agentchat-*
          path: artifacts
          merge-multiple: true
      - name: Publish release assets and updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag || inputs.release_tag }}
          SHA: ${{ needs.guard.outputs.sha }}
          WORKFLOW_SHA: ${{ needs.guard.outputs.sha }}
          PREVIOUS: ${{ inputs.previous_target_sha }}
        shell: bash
        run: bash .github/scripts/publish-tested-release.sh
